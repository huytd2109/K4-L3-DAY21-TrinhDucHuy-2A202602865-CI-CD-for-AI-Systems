name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements*.txt'
      - '.dvc/config'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-model-release
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: us-east-1
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MLFLOW_ARTIFACT_ROOT: ./mlartifacts

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ fromJSON(secrets.STORAGE_CREDENTIALS).aws_access_key_id }}
          aws-secret-access-key: ${{ fromJSON(secrets.STORAGE_CREDENTIALS).aws_secret_access_key }}
          aws-session-token: ${{ fromJSON(secrets.STORAGE_CREDENTIALS).aws_session_token }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json
          import os
          with open("outputs/report.json") as file:
              report = json.load(file)
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(f"f1={report['f1_score']}\n")
          PYEOF
      - name: Save trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.joblib
          if-no-files-found: error
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          MODEL_F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import math
          import os
          f1 = float(os.environ["MODEL_F1"])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1.0:
              raise SystemExit(f"FAILED: f1_score {f1} must be in [0.65, 1.0]. Deployment blocked.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65.")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install upload dependency
        run: pip install boto3==1.43.106
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ fromJSON(secrets.STORAGE_CREDENTIALS).aws_access_key_id }}
          aws-secret-access-key: ${{ fromJSON(secrets.STORAGE_CREDENTIALS).aws_secret_access_key }}
          aws-session-token: ${{ fromJSON(secrets.STORAGE_CREDENTIALS).aws_session_token }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Upload approved model to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          client = boto3.client("s3")
          client.upload_file("models/model.joblib", os.environ["ARTIFACT_BUCKET"], "artifacts/current/model.joblib")
          print("Approved model uploaded to S3.")
          PYEOF
      - name: Copy serving code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ vars.SERVER_HOST_FINGERPRINT }}
          source: "src/serve.py,requirements-serving.txt"
          target: "income-lab"
      - name: Restart inference service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ vars.SERVER_HOST_FINGERPRINT }}
          script_stop: true
          script: |
            set -eu
            cd "$HOME/income-lab"
            .venv/bin/python -m pip install -r requirements-serving.txt
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 5 http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
